name: terralogic
description: "A new Flutter project for smart agricultural management."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  # 🔥 مكتبات الفايربيس الأساسية وقاعدة البيانات
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  firebase_storage: ^12.1.0
  cloud_firestore: ^5.0.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  fl_chart: ^1.2.0
  tflite_flutter: ^0.12.1  # لتشغيل نموذج الذكاء الاصطناعي
  image: ^4.1.7          # لمعالجة الصورة وتغيير أبعادها لتناسب النموذج
  html: ^0.15.4
  shared_preferences: ^2.2.0 # لحفظ الأسعار محلياً
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.jpg
    - assets/plant_disease_model.tflite
    - assets/labels.txt

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.jpg
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/images/logo.jpg
    background_color: "#FFFFFF"
    theme_color: "#2E7D32"